[package]
name = "waku-protocol"
version = "0.1.0"
edition = "2024"
description = "Versioned, transport-neutral wire contract shared by Waku clients and daemon"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
# The record layer's AEAD. RustCrypto, matching the family `waku-core` already
# draws in through the dalek crates.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
# The daemon's signing key and the handshake's key agreement. dalek rather than
# ring so the whole workspace holds a single curve25519 implementation.
ed25519-dalek = { version = "2", features = ["rand_core"] }
hkdf = { version = "0.12", default-features = false }
rand_core = { version = "0.6", features = ["getrandom"] }
rust-i18n = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The transcript hash and the HKDF instantiation both name SHA-256.
sha2 = "0.10"
similar = "3"
# The sealed connection frames records into WebSocket messages. This is the one
# transport-shaped piece of the crate: the record format and the frames that
# carry it are defined together so both ends cannot disagree about them.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# ts-rs warns on every serde attribute it does not model. The ones used here,
# such as `alias`, only widen what deserializes and leave the TypeScript shape
# unchanged.
ts-rs = { version = "12.0.1", features = ["chrono-impl", "no-serde-warnings", "serde-json-impl", "uuid-impl"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
x25519-dalek = { version = "2", default-features = false, features = [
    "static_secrets",
    "zeroize",
    "getrandom",
] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows exposes the UI language list through Win32, not the POSIX locale
# environment variables, so system language detection needs these bindings.
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
