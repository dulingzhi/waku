[package]
name = "waku-core"
version = "0.1.0"
edition = "2024"
description = "Headless provider, persistence, and workspace runtime for Waku"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
agent-client-protocol = "2.0.0"
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crossbeam-channel = "0.5"
dirs = "6.0"
# The daemon's long-lived signing key, and the X25519 half of the relay's
# key agreement. Both are dalek so the crate graph holds one curve25519
# implementation rather than two; `ed25519-dalek` already pulls
# `curve25519-dalek` in for the updater.
# `rand_core` is what `SigningKey::generate` needs; `zeroize` (on by default)
# wipes the seed on drop.
ed25519-dalek = { version = "2", features = ["rand_core"] }
nucleo-matcher = "0.3"
# The `rand_core` both dalek crates are built against (0.6), so `OsRng` from it
# is the type their `random_from_rng` signatures accept. A 0.9 `OsRng` is a
# different type and will not compile against them.
rand_core = { version = "0.6", features = ["getrandom"] }
parking_lot = "0.12"
# A Windows screenshot arrives as an uncompressed bitmap; storing it as PNG is
# an order of magnitude smaller. Decoding reuses the preview crate Waku already
# links, and encoding reuses `png`, which `winc-editor` brings in — both are
# already in the graph, so these add edges rather than compile work.
png = "0.18"
rust-i18n = "4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize"] }
serde_json = "1.0"
# Already in the graph through `ed25519-dalek`; declared directly so the
# identity fingerprint can hash the public key rather than slice its bytes.
sha2 = "0.10"
smol = "2"
subtle = "2"
toml = "0.8"
trash = "5.2.6"
# `handshake` covers the accepted side of a WebSocket; `rustls-tls-native-roots`
# adds the dialing side, which the daemon needs to reach a `wss://` relay. The
# TLS stack is the one `waku-client` already builds against, so enabling it here
# shares a single `rustls` (verified with `cargo tree -i rustls`) rather than
# compiling a second copy into the desktop binary.
tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
    "rustls-tls-native-roots",
] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
waku-protocol = { path = "../waku-protocol" }
# `static_secrets` supplies `StaticSecret`, which a key that outlives one
# connection needs; `zeroize` makes the private half wipe itself on drop;
# `getrandom` is what `StaticSecret::random()` needs — it draws from
# `rand_core::OsRng`, whose `getrandom` feature is off by default.
x25519-dalek = { version = "2", default-features = false, features = [
    "static_secrets",
    "zeroize",
    "getrandom",
] }
zeroize = { version = "1", features = ["derive"] }
# Winc's headless git and workspace: the same implementation the editor drives,
# so the daemon and the editor cannot disagree about what a repository or a
# directory listing is. Pinned to a tag for the same reason the desktop's
# dependencies are: a Winc release must not change what this builds against.
winc-editor = { git = "https://github.com/DEEIX-AI/Winc", tag = "v0.1.857" }
# Already in the tree through `winc-editor`; named directly because the blob
# store decodes clipboard bitmaps with it rather than only through the editor.
winc-preview = { git = "https://github.com/DEEIX-AI/Winc", tag = "v0.1.857" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
waku-client = { path = "../waku-client" }
# The end-to-end relay test runs a real relay in-process rather than a mock:
# what it has to prove is that a client reaches a daemon through a process that
# never learns the session key, and a mock would be the thing under test.
waku-relay = { path = "../waku-relay" }
