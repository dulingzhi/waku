name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxi-dev \
            libxtst-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xdg-desktop-portal

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-rust-1.96.0-cargo-

      - name: Run tests
        run: cargo test --locked

      - name: Verify in-process Cua SDK and REPL lifecycle
        run: |
          cargo build --locked --package waku --bin waku_js_repl --package waku-computer-use --bin waku_computer_use
          bun scripts/cua-driver.ts bundle target/debug target/debug/resources debug
          bun scripts/test-computer-use.ts

      # The generated protocol and browser client are platform-independent, so
      # one runner is enough to catch a drifted checked-in artifact.
      - name: Install JavaScript dependencies
        if: runner.os == 'Linux'
        run: bun install --frozen-lockfile

      - name: Check generated protocol and browser client
        if: runner.os == 'Linux'
        run: |
          bun run protocol:check
          bun run --filter @waku/client check
          bun run --filter @waku/client test

      # The shared locale core is imported by both web and mobile, and its
      # tests are what keep locales/*.yml in sync with each other.
      - name: Check shared locale core
        if: runner.os == 'Linux'
        run: |
          bun run --filter @waku/i18n check
          bun run --filter @waku/i18n test

      # Mobile reads a generated catalog because Metro has no `?raw` import.
      # `i18n:check` fails if the checked-in module drifted from the YAML, and
      # the mobile suite asserts every key the app references exists.
      - name: Check mobile i18n catalog and client
        if: runner.os == 'Linux'
        run: |
          bun run i18n:check
          bun run --filter @waku/mobile typecheck
          bun run --filter @waku/mobile test
