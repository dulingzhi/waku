name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang \
            cmake \
            libfontconfig-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxi-dev \
            libxtst-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            xdg-desktop-portal

      # `--profile minimal` installs rustc and cargo only, so the components
      # the fmt and clippy steps below need are absent otherwise. Only the
      # Linux runner lints, so the other two do not pay for the download.
      - name: Install Rust formatting and lint tools
        if: runner.os == 'Linux'
        run: rustup component add rustfmt clippy

      # Formatting is platform-independent, so one runner is enough, and the
      # cheapest check failing first keeps a long matrix from being wasted.
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --package waku --package waku-protocol --package waku-client --package waku-core --package waku-daemon -- --check

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-rust-1.96.0-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-rust-1.96.0-cargo-

      - name: Run tests
        run: cargo test --locked

      # Linux only: clippy shares the cached target directory with the test
      # build, so the other two runners would repeat a long compile for lint
      # output that is nearly platform-independent.
      - name: Lint Rust
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Verify in-process Cua SDK and REPL lifecycle
        run: |
          cargo build --locked --package waku --bin waku
          bun scripts/cua-driver.ts bundle target/debug target/debug/resources debug
          bun scripts/test-computer-use.ts

      # A package ships one executable for four jobs. That only works if the mode
      # word selects the right one, and a lost flag fails silently by starting the
      # window system instead of answering. No SDK or network is needed, so this
      # runs on every operating system before the SDK smoke test above.
      - name: Verify one executable dispatches every mode
        run: |
          cargo build --locked --package waku --bin waku
          bun scripts/test-mode-dispatch.ts

      # The generated protocol and browser client are platform-independent, so
      # one runner is enough to catch a drifted checked-in artifact.
      - name: Install JavaScript dependencies
        if: runner.os == 'Linux'
        run: bun install --frozen-lockfile

      - name: Check generated protocol and browser client
        if: runner.os == 'Linux'
        run: |
          bun run protocol:check
          bun run --filter @waku/client check
          bun run --filter @waku/client test

      # The shared locale core is imported by both web and mobile, and its
      # tests are what keep locales/*.yml in sync with each other.
      - name: Check shared locale core
        if: runner.os == 'Linux'
        run: |
          bun run --filter @waku/i18n check
          bun run --filter @waku/i18n test

      # Mobile reads a generated catalog because Metro has no `?raw` import.
      # `i18n:check` fails if the checked-in module drifted from the YAML, and
      # the mobile suite asserts every key the app references exists.
      - name: Check mobile i18n catalog and client
        if: runner.os == 'Linux'
        run: |
          bun run i18n:check
          bun run --filter @waku/mobile typecheck
          bun run --filter @waku/mobile test

      # Web shipped without any CI coverage: its 24 suites never ran and it was
      # never typechecked, so a broken import could reach `main` unnoticed.
      - name: Check web client
        if: runner.os == 'Linux'
        run: |
          bun run --filter @waku/web typecheck
          bun run --filter @waku/web test
